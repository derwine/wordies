[tool.poetry]
name = "wordies"
version = "0.1.0"
description = "A polished five-letter word guessing game for the terminal."
authors = ["Derwin Emmanuel <derwin.emmanuel@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
english-words = "^2.0.1"
rich = "^14.2.0"
textual = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start-game = "main:start"
